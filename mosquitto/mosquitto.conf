log_dest stdout
persistence false

# Bắt buộc đăng nhập (2026-11-18): broker ẩn danh cho phép bất kỳ ai publish bản tin giả vào
# stations/<mã>/status -> tạo phiên sạc / tiền điện giả. Xem mosquitto/README.md.
# per_listener_settings mặc định false -> các thiết lập dưới áp cho mọi listener.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883

listener 9001
protocol websockets
