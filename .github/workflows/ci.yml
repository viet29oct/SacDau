# Chạy test backend và build frontend mỗi lần push, nhánh nào cũng chạy.
# Kết quả gắn vào commit nên PR thấy luôn, không cần chạy lại theo pull_request.
# iot/ (Wokwi) và gis/ (QGIS) không chạy được ở đây, vẫn kiểm tra tay (QUY_TAC mục 3).
name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Cùng image với docker-compose.yml
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sacdau_test
          POSTGRES_USER: sacdau_user
          POSTGRES_PASSWORD: sacdau_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sacdau_user -d sacdau_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sacdau_user:sacdau_dev_pw@localhost:5432/sacdau_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:db:migrate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
