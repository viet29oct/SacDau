; Build firmware cho Wokwi VS Code extension / wokwi-cli.
; Dung chung sketch.ino voi ban chay tren wokwi.com (khong can doi code).
;   pio run            -> tao .pio/build/esp32dev/firmware.{bin,elf}
;   F1 > "Wokwi: Start Simulator" (doc wokwi.toml + diagram.json)

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<sketch.ino> +<sketch.ino.cpp>
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
